services:
  backend:
    build: ./nodejs2015typescript
    container_name: nodejs2025
    ports:
      - "5000:5000"
    volumes:
      - ./nodejs2015typescript:/nodejs2025
    environment:
      - PORT=5000
    command: npm run start

  frontend:
    build: ./
    container_name: nextjs2025
    depends_on:
      - backend
    expose:
      - "3000"
    volumes:
      - ./:/nextjs15-final

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "3000:80" # expose frontend trên 3000
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
